name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A hackathon means frequent pushes. Cancel superseded runs so the queue
# never hides the result you actually care about.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # typecheck + server tests + production builds for web and server.
      # Needs no container engine and no Ark key, so it is fully self-contained.
      - run: npm run check
